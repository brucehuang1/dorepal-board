name: Sync board from dorepal.com

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [board-sync]

permissions:
  contents: write

concurrency:
  group: board-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull the board
        run: node scripts/sync.mjs
        env:
          BOARD_SOURCE: https://dorepal.com/v1/board
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "no changes"; exit 0
          fi
          git config user.name "dore-board[bot]"
          git config user.email "hello@dorepal.com"
          git add -A
          git commit -m "sync: $(date -u +'%Y-%m-%d %H:%M UTC') · ${{ github.event_name }}${{ github.event.client_payload.reason && format(' · {0}', github.event.client_payload.reason) || '' }}"
          git push
